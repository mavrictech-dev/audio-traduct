name: audio_traductor
description: "Traducción de voz en tiempo real para conferencias."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── State Management ──
  flutter_riverpod: ^2.6.1

  # ── ML Kit On-Device Translation ──
  google_mlkit_translation: ^0.13.1

  # ── Whisper.cpp On-Device Speech-to-Text (offline, sin API key) ──
  whisper_flutter_new: ^1.0.1

  # ── Permisos runtime (BLUETOOTH_CONNECT) ──
  permission_handler: ^11.3.1

  # ── HTTP (descarga del modelo de Whisper con progreso) ──
  http: ^1.6.0

  # ── Audio ──
  audio_session: ^0.1.25
  record: ^6.2.0
  just_audio: ^0.9.42
  flutter_tts: ^4.2.0

  # ── Local Storage ──
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ── Export ──
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # ── Bluetooth ──
  flutter_blue_plus: ^1.34.0

  # ── Connectivity ──
  connectivity_plus: ^6.1.4

  # ── Functional Programming ──
  dartz: ^0.10.1

  # ── Date / ID / Equality ──
  intl: ^0.19.0
  equatable: ^2.0.7
  uuid: ^4.5.1

  # ── UI ──
  flex_color_scheme: ^8.1.0
  google_fonts: ^6.2.1
  animated_icon: ^0.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4


flutter:
  uses-material-design: true

  # Solo lo que la app lee en tiempo de ejecución. El arte que consumen los
  # generadores de icono y splash (icon-sf*.png, icon-traductor.png) vive en
  # `assets/` pero no se empaqueta: sumaba ~4,8 MB muertos al APK.
  # Los directorios de marca sí van enteros, para poder agregar o reemplazar
  # piezas sin volver a tocar este archivo.
  assets:
    - assets/splash-bg.png
    - assets/brand/
    - assets/icon/

# ── Icono de la app ─────────────────────────────────────────────────
#
# iOS 18+: el sistema cambia solo entre el icono claro y el oscuro según el
# modo del dispositivo (`image_path_ios_dark_transparent` y la variante
# teñida). Android no ofrece ese cambio automático: lo más cercano es el
# "icono con tema" de Android 13+, que tiñe la capa `adaptive_icon_monochrome`
# con la paleta del sistema cuando el usuario activa esa opción.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app-icon-light.png"
  image_path_android: "assets/icon/app-icon-light.png"
  image_path_ios: "assets/icon/app-icon-light.png"
  # iOS 18: variantes oscura y teñida. Van con el arte transparente porque el
  # sistema pinta su propio fondo detrás; una imagen opaca con las esquinas
  # ya redondeadas se vería recortada dos veces.
  image_path_ios_dark_transparent: "assets/icon/app-icon-transparent.png"
  image_path_ios_tinted_grayscale: "assets/icon/app-icon-transparent.png"
  # iOS pide la variante teñida en escala de grises; la desatura el generador.
  desaturate_tinted_to_grayscale_ios: true
  remove_alpha_ios: true
  # Android 13+: para habilitar el "icono con tema" hacen falta dos PNG
  # extra dibujados con zona segura (el arte ocupa el 66% central, el resto
  # transparente). Con el arte actual a sangre el recorte queda mal, así que
  # queda documentado y desactivado:
  # adaptive_icon_background: "#FFFFFF"
  # adaptive_icon_foreground: "assets/icon/app-icon-foreground.png"
  # adaptive_icon_monochrome: "assets/icon/app-icon-monochrome.png"

# ── Splash nativo ───────────────────────────────────────────────────
#
# Es el fondo que pinta el sistema operativo mientras arranca el proceso,
# antes del primer frame de Flutter. Se mantiene mínimo y del color del tema
# para que empalme sin salto con la pantalla de carga animada de la app.
flutter_native_splash:
  color: "#E8F0FE"
  color_dark: "#0A1628"
  image: assets/icon/app-icon-transparent.png
  image_dark: assets/icon/app-icon-transparent.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#E8F0FE"
    color_dark: "#0A1628"
    image: assets/icon/app-icon-transparent.png
    image_dark: assets/icon/app-icon-transparent.png
