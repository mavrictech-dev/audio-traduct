# Las dependencias de Flutter se encuentran en C: mientras el proyecto está
# en D:. Kotlin no puede persistir su caché incremental con raíces distintas
# en Windows, así que la desactivamos para builds reproducibles de release.
kotlin.incremental=false

# Dependencias actuales de Flutter, ML Kit y audio usan AndroidX.
android.useAndroidX=true
# No hay dependencias antiguas support-library que migrar. Evitar Jetifier
# impide que intente reescribir los grandes binarios nativos de Flutter.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
